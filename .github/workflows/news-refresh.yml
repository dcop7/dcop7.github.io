name: Refresh news

# Static RSS news aggregator. The OPML (data/news/feeds.opml) is the source of
# truth. RSS feeds rarely allow CORS, so the browser can't fetch them directly;
# this workflow fetches them server-side every 4 hours (Node has no CORS),
# dedupes + classifies by topic, and commits static JSON for GitHub Pages.
# No database, no backend. Scales to hundreds of feeds.

on:
  schedule:
    - cron: '0 */4 * * *'      # every 4 hours (UTC)
  workflow_dispatch:           # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Aggregate feeds → static JSON
        run: node data/news/build-news.mjs
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}   # optional: enables the Trailers tab (free key from themoviedb.org)
          # optional: last-resort acquisition for sources that block fetching
          TINYFISH_KEY: ${{ secrets.TINYFISH_KEY }}

      - name: Commit updated news if changed
        run: |
          if [ -n "$(git status --porcelain data/news/*.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news/*.json
            git commit -m "chore(news): refresh aggregated feeds [skip ci]"
            # Ten workflows commit to main and one of them runs every 15 minutes,
            # so losing the push race is normal, not exceptional. Rebase onto
            # whatever landed and try again instead of failing the run. The
            # snapshot this job wrote is the newest, so replaying it on top is
            # always the intended result.
            push_with_retry() {
              for i in 1 2 3 4 5; do
                if git push; then return 0; fi
                echo "push rejected (attempt $i/5) — rebasing onto origin/main"
                git pull --rebase origin main || { git rebase --abort || true; return 1; }
                sleep $(( (RANDOM % 5) + 3 ))
              done
              echo "::error::could not push after 5 attempts"
              return 1
            }
            push_with_retry
          else
            echo "No news changes — nothing to commit."
          fi
