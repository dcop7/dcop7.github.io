name: Refresh ▸ dados frequentes

# The snapshots that need refreshing several times a day: the RSS news
# aggregator (~4 h, currently disabled), the gaming deal catalog (~6 h) and
# the Cidadão feed of official announcements (~6 h). One job, one checkout,
# one commit.
#
# The cron fires every two hours and each step decides for itself whether its
# own data is old enough to rebuild — see refresh-daily.yml for why nothing
# here is allowed to gate on the hour of day, and for the rules every build
# follows through run-build.sh: own time limit, rollback on failure, and an
# alert issue only once a snapshot outlives its grace period.
#
# Grace periods: notícias 24 h · promoções 48 h · cidadão 72 h.
#
# A manual run rebuilds everything, gates included.

on:
  schedule:
    - cron: '7 */2 * * *'      # UTC, off the :00/:15/:30/:45 peaks
  workflow_dispatch:

permissions:
  contents: write
  issues: write        # report.sh opens/closes the "[refresh] …" alert issues

concurrency:
  group: refresh-often
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Backstop above the step timeouts (10+8+6 = 24) plus setup and commit.
    timeout-minutes: 35
    env:
      FORCE: ${{ github.event_name != 'schedule' }}
      REFRESH_REPORT_DIR: ${{ runner.temp }}/refresh-report
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # RSS feeds rarely allow CORS, so the browser cannot fetch them; this
      # runs server-side, dedupes + classifies by topic and commits static
      # JSON. data/news/feeds.opml is the source of truth.
      # DESATIVADO (set/2026): a secção Notícias está desligada no site
      # (DISABLED_ROUTES em js/core/nav.js). Para reativar, apaga o `if`.
      - name: Notícias ▸ agregar feeds
        id: news
        if: false
        continue-on-error: true
        timeout-minutes: 10
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}       # optional: enables the Trailers tab
          TINYFISH_KEY: ${{ secrets.TINYFISH_KEY }}  # optional: last-resort acquisition
        run: >
          bash .github/scripts/run-build.sh notícias data/news/index.json 3.5 24 8
          "data/news" -- node data/news/build-news.mjs

      # ~100 s observed.
      - name: Product Discovery ▸ promoções de jogos
        id: discovery
        continue-on-error: true
        timeout-minutes: 8
        env:
          # Optional: free key from isthereanydeal.com/apps/ → EUR prices +
          # full price-history charts. Works fine without it (USD via CheapShark).
          ITAD_KEY: ${{ secrets.ITAD_KEY }}
        run: >
          bash .github/scripts/run-build.sh promoções data/discovery/gaming/index.json 5.5 48 6
          "data/discovery" -- node data/discovery/gaming/build-gaming.mjs

      # Official portals rarely expose usable CORS/feeds, so the aggregation
      # of Diário da República + official-domain news happens here. ~35 s.
      - name: Cidadão ▸ novidades oficiais
        id: cidadao
        continue-on-error: true
        timeout-minutes: 6
        run: >
          bash .github/scripts/run-build.sh cidadão data/cidadao/novidades.json 5.5 72 4
          "data/cidadao" -- node data/cidadao/build-cidadao.mjs

      - name: Assunto do commit
        id: msg
        if: always()
        run: |
          list=""
          for row in "notícias:${{ steps.news.outputs.built }}" \
                     "promoções:${{ steps.discovery.outputs.built }}" \
                     "cidadão:${{ steps.cidadao.outputs.built }}"; do
            [ "${row##*:}" = yes ] && list="${list:+$list, }${row%%:*}"
          done
          echo "text=chore(data): refresh ${list:-nada}" >> "$GITHUB_OUTPUT"

      # Whole directories, not file lists: build-news.mjs writes topic-*.json,
      # index.json AND the sources-resolved.json acquisition cache, and it was
      # exactly that unlisted cache file that broke the Destaques workflow.
      # Sharing data/news with refresh-destaques.yml is safe because the rebase
      # replays only this job's diff.
      - uses: ./.github/actions/commit-push
        id: publish
        if: always()
        continue-on-error: true
        with:
          paths: data/news data/discovery data/cidadao
          message: "${{ steps.msg.outputs.text || 'chore(data): refresh parcial' }}"

      - name: Resumo e alertas
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          bash .github/scripts/report.sh
          "notícias:${{ steps.news.outcome }}:${{ steps.news.outputs.state }}"
          "promoções:${{ steps.discovery.outcome }}:${{ steps.discovery.outputs.state }}"
          "cidadão:${{ steps.cidadao.outcome }}:${{ steps.cidadao.outputs.state }}"
          --publish "${{ steps.publish.outcome }}"
