name: Refresh ▸ dados diários

# One job for every snapshot that only needs rebuilding once a day, plus the
# utility snapshot, which wants a few passes. Merging them replaced five
# separate workflows — five runner start-ups, five checkouts and five racing
# pushes — with one run and one commit.
#
# Four rules make this reliable:
#
#  1. Nothing is gated on the hour of day. GitHub delays cron runs by minutes
#     to HOURS, so "is it 07h in Lisbon?" silently skipped whole days — which
#     is exactly what had been happening to the Eventos snapshot. Every step
#     asks stale.mjs whether ITS OWN data is out of date instead, so the crons
#     below are just catch-up attempts: the first one to find stale data does
#     the work, the rest cost ~20 s and commit nothing.
#
#  2. Each build is independent. One failing source must not cost the site the
#     others, and everything that did succeed is committed.
#
#  3. NO STEP MAY SPEND THE JOB'S TIME BUDGET. A job killed by its own
#     timeout-minutes skips every remaining step — including the commit. From
#     25/08 to 31/08 "Descobrir Tech" overran a 20 min ceiling on EVERY run
#     and today.json, f1 and eventos were built 23 times and thrown away
#     unpublished. So every build runs under its own limit (run-build.sh's
#     `timeout`, with the step's timeout-minutes as a backstop just above it),
#     the job ceiling stays above all of them added together, the expensive
#     build runs LAST, and the commit runs under always().
#
#  4. THE ALARM IS THE DATA, NOT THE EXIT CODE. External sources go down
#     (14/11/2026: nocartaz.pt vanished behind a Vercel 402 and this run failed
#     six times a day for something no code here could fix). run-build.sh
#     rolls a failed build back and keeps the previous snapshot; only once a
#     snapshot outlives its grace period does report.sh open ONE issue, which
#     closes itself when the data is fresh again. A source's bad hour is a
#     warning in the run, never a notification.
#
# Grace periods (how long the site may live on the previous snapshot):
#   homepage 48 h — the browser already rebuilds a stale day from Wikimedia
#   útil     48 h — fuel/electricity/weather lose their point after a day or two
#   f1       96 h — changes once per race weekend
#   eventos 336 h — future-only, so a two-week-old snapshot is still mostly right
#   oss     168 h — a catalogue; a week behind is fine
#
# A manual run rebuilds everything, gates included.

on:
  schedule:
    - cron: '20 5,6,10,13,14,18 * * *'   # UTC; 5 and 6 cover the Lisbon DST pair
  workflow_dispatch:

permissions:
  contents: write
  issues: write        # report.sh opens/closes the "[refresh] …" alert issues

concurrency:
  group: refresh-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A BACKSTOP, not a budget: it stays above the sum of the step timeouts
    # below (6+6+6+7+38 = 63) plus checkout, setup, commit and report, so a slow
    # build is cut by its own limit while the job survives to publish.
    timeout-minutes: 75
    env:
      FORCE: ${{ github.event_name != 'schedule' }}
      REFRESH_REPORT_DIR: ${{ runner.temp }}/refresh-report
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # GROQ_KEY only ranks the three "on this day" sections (ids in, ids out
      # — no text is generated). Without it the build still succeeds and those
      # sections keep their heuristic order. ~70 s observed.
      - name: Homepage ▸ today.json
        id: home
        continue-on-error: true
        timeout-minutes: 6
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: >
          bash .github/scripts/run-build.sh homepage data/home/today.json day 48 4
          "data/home" -- node data/home/build-home.mjs

      # Fuel (DGEG), electricity (OMIE day-ahead) and the weather fallback.
      # The 4 h window is what gives this one several passes a day, so the
      # afternoon OMIE publication is picked up on the same day.
      - name: Útil hoje ▸ utility.json
        id: utility
        continue-on-error: true
        timeout-minutes: 6
        run: >
          bash .github/scripts/run-build.sh útil data/home/utility.json 4 48 4
          "data/home" -- node data/home/build-utility.mjs

      - name: Fórmula 1 ▸ classificações e calendário
        id: f1
        continue-on-error: true
        timeout-minutes: 6
        run: >
          bash .github/scripts/run-build.sh f1 data/f1/cache.json day 96 4
          "data/f1" -- node data/f1/build-f1.mjs

      # data/events covers nocartaz.json AND home.json (the Home card's slice).
      - name: Eventos ▸ snapshot nacional NoCartaz
        id: events
        continue-on-error: true
        timeout-minutes: 7
        run: >
          bash .github/scripts/run-build.sh eventos data/events/nocartaz.json day 336 5
          "data/events" -- node data/events/build-nocartaz.mjs

      # LAST ON PURPOSE. Minutes where the others are seconds: ~155 spaced
      # Search calls plus ~800 sequential repo lookups, kept slow to stay inside
      # the rate limits. GraphQL enrichment is cached for 7 days per project,
      # and OSS_BUDGET_MIN is a soft deadline — past it the build stops
      # fetching and writes what it has, well before run-build.sh's 36 min cut.
      - name: Descobrir Tech ▸ catálogo open-source
        id: oss
        continue-on-error: true
        timeout-minutes: 38
        env:
          # Automatic, repo-scoped token (no user-managed secret). Lifts rate
          # limits and enables GraphQL enrichment (languages, watchers).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSS_BUDGET_MIN: 31
        run: >
          bash .github/scripts/run-build.sh oss data/oss/index.json day 168 36
          "data/oss" -- node data/oss/build-oss.mjs

      # always(): if the job is cancelled this still has to run, or the commit
      # below inherits an empty subject.
      - name: Assunto do commit
        id: msg
        if: always()
        run: |
          list=""
          for row in "homepage:${{ steps.home.outputs.built }}" \
                     "útil:${{ steps.utility.outputs.built }}" \
                     "f1:${{ steps.f1.outputs.built }}" \
                     "eventos:${{ steps.events.outputs.built }}" \
                     "oss:${{ steps.oss.outputs.built }}"; do
            [ "${row##*:}" = yes ] && list="${list:+$list, }${row%%:*}"
          done
          echo "text=chore(data): refresh ${list:-nada}" >> "$GITHUB_OUTPUT"

      # always() is what makes rule 3 hold: whatever was built before the job
      # ran out of time is published anyway. A failed build was already rolled
      # back by run-build.sh, so only complete, valid snapshots are staged.
      # continue-on-error: a lost push is retried by the next cron (the gates
      # still see the old data); report.sh raises it if it keeps happening.
      - uses: ./.github/actions/commit-push
        id: publish
        if: always()
        continue-on-error: true
        with:
          paths: data/home data/oss data/f1 data/events
          message: "${{ steps.msg.outputs.text || 'chore(data): refresh parcial' }}"

      - name: Resumo e alertas
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          bash .github/scripts/report.sh
          "homepage:${{ steps.home.outcome }}:${{ steps.home.outputs.state }}"
          "útil:${{ steps.utility.outcome }}:${{ steps.utility.outputs.state }}"
          "f1:${{ steps.f1.outcome }}:${{ steps.f1.outputs.state }}"
          "eventos:${{ steps.events.outcome }}:${{ steps.events.outputs.state }}"
          "oss:${{ steps.oss.outcome }}:${{ steps.oss.outputs.state }}"
          --publish "${{ steps.publish.outcome }}"
