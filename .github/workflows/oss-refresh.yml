name: Refresh Descobrir Tech

# Builds the open-source discovery catalog (data/oss/*) once a day. Runs
# server-side (no CORS, no browser rate limits): GitHub Search + GraphQL
# (authenticated with the automatic GITHUB_TOKEN — the repo owner manages no
# key), Hacker News (Algolia), and community Awesome Lists. Correlates,
# scores relevance and commits static JSON for GitHub Pages. The browser only
# ever reads that JSON. See data/oss/build-oss.mjs.

on:
  schedule:
    - cron: '20 5 * * *'      # ~daily (UTC), early morning
  workflow_dispatch:           # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: oss-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build catalog → static JSON
        run: node data/oss/build-oss.mjs
        env:
          # Automatic, repo-scoped token (no user-managed secret). Lifts rate
          # limits and enables GraphQL enrichment (languages, watchers).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit catalog if it changed
        run: |
          if [ -n "$(git status --porcelain data/oss)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/oss
            git commit -m "chore(oss): refresh discovery catalog [skip ci]"
            # Ten workflows commit to main and one of them runs every 15 minutes,
            # so losing the push race is normal, not exceptional. Rebase onto
            # whatever landed and try again instead of failing the run. The
            # snapshot this job wrote is the newest, so replaying it on top is
            # always the intended result.
            push_with_retry() {
              for i in 1 2 3 4 5; do
                if git push; then return 0; fi
                echo "push rejected (attempt $i/5) — rebasing onto origin/main"
                git pull --rebase origin main || { git rebase --abort || true; return 1; }
                sleep $(( (RANDOM % 5) + 3 ))
              done
              echo "::error::could not push after 5 attempts"
              return 1
            }
            push_with_retry
          else
            echo "No catalog changes — nothing to commit."
          fi
