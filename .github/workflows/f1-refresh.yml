name: Refresh F1 data

# Snapshots the slow Formula 1 data (driver & constructor standings, calendar,
# last-race results) into data/f1/cache.json once a day from Jolpica (the open
# Ergast successor), so the browser reads one local JSON first — fast, offline,
# no per-visit third-party calls. Live timing / track positions are fetched
# live from OpenF1 in the browser (CORS-open), not here.

on:
  schedule:
    - cron: '40 6 * * *'      # ~daily, after most races settle
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build F1 cache
        run: node data/f1/build-f1.mjs

      - name: Commit snapshot if it changed
        run: |
          if [ -n "$(git status --porcelain data/f1/cache.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/f1/cache.json
            git commit -m "chore(f1): refresh standings/calendar snapshot [skip ci]"
            # Ten workflows commit to main and one of them runs every 15 minutes,
            # so losing the push race is normal, not exceptional. Rebase onto
            # whatever landed and try again instead of failing the run. The
            # snapshot this job wrote is the newest, so replaying it on top is
            # always the intended result.
            push_with_retry() {
              for i in 1 2 3 4 5; do
                if git push; then return 0; fi
                echo "push rejected (attempt $i/5) — rebasing onto origin/main"
                git pull --rebase origin main || { git rebase --abort || true; return 1; }
                sleep $(( (RANDOM % 5) + 3 ))
              done
              echo "::error::could not push after 5 attempts"
              return 1
            }
            push_with_retry
          else
            echo "No changes in cache.json."
          fi
