name: Refresh ▸ ocorrências

# fogos.pt stopped allowing CORS from third-party origins, so the browser on
# GitHub Pages cannot call api.fogos.pt directly. This fetches the active
# ANEPC incidents server-side every 15 minutes and commits a same-origin JSON
# snapshot (data/ocorrencias/ocorrencias.json) that the Ocorrências page uses
# as its zero-config data source. Users who add a free API Aberta key in the
# UI get live browser-side data instead.
#
# This is the only refresh kept on its own workflow: at ~96 runs a day it is
# by far the noisiest writer, and putting it in a shared concurrency group
# with the other refreshes would let it cancel their queued runs — trading a
# push race, which commit-push already absorbs, for lost daily builds.

# DESATIVADO (set/2026): a secção Ocorrências PT está desligada no site
# (DISABLED_ROUTES em js/core/nav.js). Para reativar, repõe o schedule.
on:
  # schedule:
  #   - cron: '*/15 * * * *'     # UTC; GitHub may delay a run, never mind the exact minute
  workflow_dispatch:

permissions:
  contents: write
  issues: write        # report.sh opens/closes the "[refresh] …" alert issues

concurrency:
  group: refresh-ocorrencias
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Same contract as every refresh (see refresh-daily.yml): own time limit,
      # rollback on failure, alert issue only once the snapshot is >2 h old.
      # Gate 0.01 h = rebuild on every run; this data is live by nature.
      - name: Snapshot das ocorrências ativas → JSON estático
        id: occ
        continue-on-error: true
        timeout-minutes: 7
        run: >
          bash .github/scripts/run-build.sh ocorrências data/ocorrencias/ocorrencias.json 0.01 2 5
          "data/ocorrencias" -- node data/ocorrencias/build-ocorrencias.mjs

      - uses: ./.github/actions/commit-push
        id: publish
        if: steps.occ.outputs.built == 'yes'
        continue-on-error: true
        with:
          paths: data/ocorrencias
          message: 'chore(ocorrencias): refresh incidents snapshot'

      - name: Resumo e alertas
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          bash .github/scripts/report.sh
          "ocorrências:${{ steps.occ.outcome }}:${{ steps.occ.outputs.state }}"
          --publish "${{ steps.publish.outcome }}"
